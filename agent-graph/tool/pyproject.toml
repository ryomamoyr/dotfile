[project]
name = "agent-graph"
version = "0.1.0"
description = "Claude Code / Codex / herdr オーケストレーションの hook・spawn・可視化ツール"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

# bin/ 直下のモジュール（common 等）を first-party として import 整列させる
[tool.ruff]
src = ["bin"]

# subprocess.run の戻りは returncode を明示的に見ているため check= の強制は不要
[tool.ruff.lint]
ignore = ["PLW1510"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
