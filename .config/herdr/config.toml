onboarding = false
[keys]
prefix = "ctrl+a"
next_tab = ["prefix+n", "cmd+alt+right"]
previous_tab = ["prefix+p", "cmd+alt+left"]
split_horizontal = ["prefix+minus", "prefix+s"]

[theme]
name = "rose-pine"
auto_switch = false

# agents欄: 主表示をworkspace名でなくtab名（cwd由来）にする
[ui.sidebar.agents]
rows = [
  ["state_icon", "pane", "tab"],
  ["terminal_title_stripped"],
]
